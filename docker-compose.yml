version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: nestjs-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-test}
      MYSQL_USER: ${DB_USERNAME:-sypv}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql # Optional: for initial SQL scripts
    networks:
      - nestjs-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  nestjs-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
